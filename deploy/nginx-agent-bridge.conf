# =====================================================================================
# Agent Bridge 中继的 HTTPS 入口（手机端页面与接口）
#
# 用法：整个文件放进 nginx 的 http { } 上下文里（例如 /etc/nginx/conf.d/agent-bridge.conf）。
# 改两处：证书路径（ssl_certificate / ssl_certificate_key，各出现两次）、域名（server_name）。
#
# 中继的启动方式（中继本体不对公网开放任何 HTTP）：
#   RELAY_TUNNEL_URL=tls://relay.example.com:9011 \
#   FEISHU_REDIRECT_BASE=https://relay.example.com:9010 \
#   python3 relay.py serve \
#       --http-listen   127.0.0.1:19011 \                       # 只给本机的 nginx
#       --tunnel-listen 0.0.0.0:9011 \                         # 只收电脑端隧道，不讲 HTTP
#       --tls-cert /etc/agent-bridge/tls/fullchain.pem --tls-key /etc/agent-bridge/tls/privkey.pem
#
# 防火墙只放行 9010（本文件）和 9011（隧道，TLS）。19011 只在本机回环上，绝不能对外。
# =====================================================================================

# ---- 限流区（按客户端地址）---------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=ab_static:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ab_login:10m  rate=10r/m;   # 飞书登录、配对、换令牌、确认绑定
limit_req_zone  $binary_remote_addr zone=ab_enroll:10m rate=6r/m;    # 电脑端申请绑定
limit_req_zone  $binary_remote_addr zone=ab_poll:10m   rate=1r/s;    # 电脑端轮询绑定结果（每 2 秒一次）
limit_req_zone  $binary_remote_addr zone=ab_api:10m    rate=30r/s;   # 手机端日常接口
limit_req_zone  $binary_remote_addr zone=ab_task:10m   rate=2r/s;    # 发消息 / 传图片
limit_req_zone  $binary_remote_addr zone=ab_notify:10m rate=60r/m;   # 电脑端上报任务完成 / 待审批事件（公司共用出口地址，别卡太紧）
limit_req_zone  $binary_remote_addr zone=ab_update:10m rate=30r/m;   # 插件检查更新 / 下载安装包。每台电脑每 6 小时一次，但公司里很多人共用一个出口地址，所以不能卡太紧
limit_conn_zone $binary_remote_addr zone=ab_conn:10m;                # 每个地址的并发连接
limit_conn_zone $binary_remote_addr zone=ab_sse:10m;                 # 每个地址的实时推送连接

# ---- 访问日志：不记 query、不记 Authorization、不记 User-Agent / Referer，会话与任务 ID 打码 ----
# 绑定二维码里的一次性码、飞书回调的 code 都在 query 里，所以用 $uri（不含 query）而不是 $request。
map $uri $ab_log_uri {
    "~^/sessions/[0-9a-f-]{36}/(?<ab_what>[a-z]+)$"  "/sessions/:id/$ab_what";
    "~^/tasks/[0-9a-f]{32}/cancel$"                  "/tasks/:id/cancel";
    "~^/approvals/[0-9a-f]{32}$"                     "/approvals/:id";
    default                                        $uri;
}
log_format ab_privacy '$remote_addr [$time_local] $request_method $ab_log_uri $status $body_bytes_sent $request_time';

# 中继的 HTTP 面，只监听本机
upstream ab_relay_http {
    server 127.0.0.1:19011;
}

# ---- 兜底：用 IP 或别的域名访问，直接断开（扫描器拿不到任何信息）--------------------
server {
    listen 9010 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log off;
    # 连接在读到 Host 之前，一律按这个 server 的设置计时。攻击者自己选域名，所以慢速攻击的防护必须在这里也有一份，
    # 否则半截请求会占着连接按默认的 60 秒才断开。
    client_header_timeout 10s;
    client_body_timeout   10s;
    keepalive_timeout     5s;
    reset_timedout_connection on;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;
    return 444;
}

# ---- 正式入口 ---------------------------------------------------------------------
server {
    listen 9010 ssl;
    # listen [::]:9010 ssl;                       # 服务器有 IPv6 时打开
    server_name relay.example.com;
    server_tokens off;

    # TLS：只留 1.2 / 1.3，前向保密套件，关闭会话票据（票据密钥长期有效会削弱前向保密）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ab_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling：证书链完整、服务器能解析域名时再打开
    # ssl_stapling on; ssl_stapling_verify on; ssl_trusted_certificate /etc/nginx/ssl/chain.pem; resolver 1.1.1.1 valid=300s;

    # 日志
    access_log /var/log/nginx/agent-bridge.access.log ab_privacy;
    # nginx 的错误日志会把出错请求的完整请求行写进去，包括 query 里的一次性码（飞书回调的 code、绑定二维码里的码）和会话 ID，
    # 请求体超限、被限流、中继暂时不可用都会触发。所以这里只记 crit 及以上，上面这些都不会写出来；
    # 请求的状态码和耗时仍在访问日志里（已脱敏）。排查问题时可临时改成 error，用完改回来，并清掉日志。
    error_log  /var/log/nginx/agent-bridge.error.log crit;
    # 两个日志文件的权限收紧到 640（仅 root / adm），轮转保留期不超过 14 天。

    # 慢速攻击与资源占用
    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          60s;
    keepalive_timeout     30s;
    keepalive_requests    200;
    reset_timedout_connection on;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;
    client_max_body_size  64k;                    # 默认值；只有发消息/传图片的 /tasks 放宽
    limit_conn ab_conn 40;
    limit_conn_status 429;
    limit_req_status  429;

    # 上传内容（图片、代码）在转发前由 nginx 先收完，这样慢速客户端占不了中继的连接。
    # 收到一半的内容暂存在内存盘 /dev/shm，不写磁盘，请求结束即删除，重启即清空。
    client_body_temp_path /dev/shm/agent-bridge-body 1 2;
    proxy_max_temp_file_size 0;                   # 响应永远不落盘

    # 响应头：对外统一由 nginx 加；先去掉中继自带的同名头，避免重复，并且不泄露 Python 版本
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;
    add_header Strict-Transport-Security   "max-age=31536000" always;      # 不加 includeSubDomains，也不要 preload
    add_header X-Content-Type-Options      "nosniff" always;
    add_header Referrer-Policy             "no-referrer" always;
    add_header X-Frame-Options             "DENY" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control               "no-store" always;
    # 页面的 Content-Security-Policy 由中继随页面一起下发（default-src 'none'，只允许同源脚本和样式）。

    # 转发。proxy_set_header 只在这里设置，location 里不要再写，否则会整体覆盖掉这些头。
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;   # 覆盖而不是追加：中继只采信这一个来自本机的值，限流才按真实客户端计
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           "";
    proxy_connect_timeout 3s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_next_upstream   off;                    # 绝不把一个 POST 换个后端重放
    proxy_buffering       off;                    # 响应实时转发（推送流必须），也不缓冲到磁盘

    # ======================= 白名单：只放行手机页实际用到的接口 =======================
    # 其余路径一律 404，包括 Bridge 的内部接口 /internal/*、/history、/sessions/<id>/forks、/auth/me 等。

    # 页面与静态资源
    location = / {
        limit_except GET { deny all; }
        limit_req zone=ab_static burst=40 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location ~ ^/(app\.js|markdown\.js|style\.css|favicon\.ico|healthz)$ {
        limit_except GET { deny all; }
        limit_req zone=ab_static burst=40 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location = /auth/config {
        limit_except GET { deny all; }
        limit_req zone=ab_static burst=40 nodelay;
        proxy_pass http://ab_relay_http;
    }

    # 登录、配对、绑定（严格限流）
    location ~ ^/auth/feishu/(start|callback)$ {
        limit_except GET { deny all; }
        limit_req zone=ab_login burst=10 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location ~ ^/auth/(exchange|pair|logout|enroll/info|enroll/claim)$ {
        limit_except POST { deny all; }
        limit_req zone=ab_login burst=10 nodelay;
        proxy_pass http://ab_relay_http;
    }
    # 机器人通知：手机端读写开关（令牌认证），电脑端上报事件（连接器密钥签名）。请求体都很小
    location = /auth/notify {
        limit_except GET POST { deny all; }
        limit_req zone=ab_api burst=20 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location = /auth/presence {                    # 手机页每 20 秒报一次“正在看哪个会话”，请求体很小
        limit_except POST { deny all; }
        limit_req zone=ab_api burst=20 nodelay;
        proxy_pass http://ab_relay_http;
    }
    # 一个账号的多台电脑：列出（令牌认证）、移除。手机页在每个请求里用 X-Relay-Computer 头指明发给哪一台，
    # 这个头 nginx 原样转发，由中继核对它确实属于这个账号
    location = /auth/computers {
        limit_except GET { deny all; }
        limit_req zone=ab_api burst=20 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location = /auth/computers/remove {
        limit_except POST { deny all; }
        limit_req zone=ab_login burst=10 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location = /notify/event {
        limit_except POST { deny all; }
        limit_req zone=ab_notify burst=10 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location = /enroll/start {                     # 电脑端申请绑定
        limit_except POST { deny all; }
        limit_req zone=ab_enroll burst=3 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location = /enroll/poll {                      # 电脑端轮询绑定结果
        limit_except POST { deny all; }
        limit_req zone=ab_poll burst=5 nodelay;
        proxy_pass http://ab_relay_http;
    }

    # 手机端日常接口：读
    location ~ ^/(sessions|approvals)$ {
        limit_except GET { deny all; }
        limit_req zone=ab_api burst=60 nodelay;
        proxy_pass http://ab_relay_http;
    }
    location ~ "^/sessions/[0-9a-f-]{36}/messages$" {
        limit_except GET { deny all; }
        limit_req zone=ab_api burst=60 nodelay;
        proxy_pass http://ab_relay_http;
    }
    # 手机端日常接口：写（请求体很小）
    location ~ "^/(sessions/[0-9a-f-]{36}/(mode|prefs)|approvals/[0-9a-f]{32}|tasks/[0-9a-f]{32}/cancel)$" {
        limit_except POST { deny all; }
        limit_req zone=ab_api burst=60 nodelay;
        proxy_pass http://ab_relay_http;
    }
    # 斜杠命令菜单：Bridge 偶尔会为它启动一次 claude 取技能列表（有缓存），所以限流比普通读接口严
    location = /commands {
        limit_except GET { deny all; }
        limit_req zone=ab_task burst=5 nodelay;
        proxy_pass http://ab_relay_http;
    }
    # 发消息 / 传图片：请求体最大约 9 MB
    location = /tasks {
        limit_except POST { deny all; }
        limit_req zone=ab_task burst=5 nodelay;
        client_max_body_size 10m;
        client_body_timeout  60s;
        proxy_send_timeout   120s;
        proxy_pass http://ab_relay_http;
    }
    # 实时推送（SSE）：长连接，不缓冲，每个地址最多 5 条
    location = /events {
        limit_except GET { deny all; }
        limit_conn ab_sse 5;
        proxy_read_timeout 3600s;
        proxy_pass http://ab_relay_http;
    }

    # 插件自带更新：只读静态文件，nginx 直接提供，不经过中继。
    # 目录 /opt/agent-bridge/updates/（随仓库提交，git pull 即可发布）里只放 `node scripts/release.js` 生成的两样东西：
    # latest.json 和 agent-bridge-X.Y.Z.vsix。文件名不符合下面的格式一律 404，目录不列出，不跟随符号链接。
    # 即使这个目录被人改了，插件也只会安装签名校验通过的版本（公钥内置在插件里），所以这里的权限设成对 nginx 只读即可。
    location = /updates/latest.json {
        limit_except GET { deny all; }
        limit_req zone=ab_update burst=30 nodelay;
        root /opt/agent-bridge;
        disable_symlinks on;
        default_type application/json;
        expires off;
    }
    location ~ "^/updates/agent-bridge-[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}\.vsix$" {
        limit_except GET { deny all; }
        limit_req zone=ab_update burst=30 nodelay;
        root /opt/agent-bridge;
        disable_symlinks on;
        default_type application/octet-stream;
        expires off;
    }

    location / {
        return 404;
    }
}